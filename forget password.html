<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Edu Finder</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>
  <section class="auth-page simple-forgot-page">
    <div class="auth-bg-circle circle-left"></div>
    <div class="auth-bg-circle circle-right"></div>

    <div class="simple-forgot-card">
      <a href="index.html" class="logo auth-logo">
        <span class="logo-icon">E</span>
        <span>Edu Finder</span>
      </a>

      <span class="eyebrow">Password Recovery</span>

      <h1>Forgot Password?</h1>

      <p>
        Enter your registered email address to continue with password recovery.
      </p>

      <form id="forgotPasswordForm" class="forgot-form">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrap">
            <span>✉️</span>
            <input type="email" id="forgotEmail" placeholder="Enter your email address">
          </div>
          <small class="error-text"></small>
        </div>

        <button type="submit" class="btn btn-primary full-width">
          Send Reset Link
        </button>
      </form>

      <div class="forgot-bottom">
        <a href="login.html">Back to Login</a>
        <a href="Register.html">Create Account</a>
      </div>
    </div>
  </section>

  <div class="toast" id="toast">Reset link sent!</div>

  <script src="script.js"></script>
</body>
</html>
